<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>
    <link rel="icon" type="image/png" href="./payoo.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-[#F4F5F7]">
    <div class="w-full max-w-[450px] mx-auto pb-20">
      <!-- Header: logo, balance, logout -->
      <header
        class="flex justify-between items-center p-5 bg-white border-b border-black/30"
      >
        <div class="flex items-center gap-3">
          <button id="home_button" type="button" aria-label="Go to home">
            <img src="./assets/Group.png" alt="Payoo" class="w-12" />
          </button>
          <div>
            <h2 class="font-semibold text-lg">
              $ <span id="balance">0.00</span>
            </h2>
            <p class="text-black/50 text-sm">Available Balance</p>
          </div>
        </div>
        <button class="btn" id="logout" type="button">
          <i
            class="fa-solid fa-arrow-up-from-bracket -rotate-90"
            aria-hidden="true"
          ></i>
          <span class="font-semibold">Logout</span>
        </button>
      </header>

      <!-- Welcome banner -->
      <section class="p-5 bg-white">
        <div class="flex items-center gap-2">
          <i
            class="fa-solid fa-fire text-orange-400 text-xl"
            aria-hidden="true"
          ></i>
          <h1 class="text-2xl font-bold">Welcome to Payooo!</h1>
        </div>
        <p class="mt-3 text-black/70">
          Enjoy easy and convenient financial services with us. Cash out charges
          are low and transaction speeds are instant.
        </p>
      </section>

      <!-- Service menu (buttons are created by JavaScript) -->
      <nav
        id="menu"
        class="p-5 bg-white grid grid-cols-3 gap-2 rounded-b-3xl"
        aria-label="Services"
      ></nav>

      <!-- Content sections. Only one is visible at a time. -->
      <main id="sections" class="px-4">
        <section data-section="home">
          <div class="flex justify-between items-center my-6">
            <h2 class="text-2xl font-bold">Latest Payment</h2>
            <button
              id="view_all"
              type="button"
              class="text-sm font-semibold text-blue-500 hover:text-blue-700"
            >
              View All
            </button>
          </div>
          <div id="payment_list" class="flex flex-col gap-1"></div>
        </section>

        <section data-section="transactions" class="hidden">
          <h2 class="text-2xl font-bold my-10">Transaction History</h2>
          <div id="transaction_list" class="flex flex-col gap-1"></div>
        </section>
      </main>
    </div>

    <div id="toast_container" class="toast toast-top toast-center z-50"></div>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
